openapi: 3.2.0
info:
  title: Kamino Finance Public Leaderboard API
  description: API for interacting with Kamino Finance — a Solana‑based DeFi platform offering automated liquidity vaults, lending/borrowing, leveraged strategies, and analytics.
  termsOfService: https://docs.kamino.finance/v/risk
  contact:
    name: Kamino Finance Support
    url: https://docs.kamino.finance
    email: support@kamino.finance
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://api.kamino.finance
  variables: {}
tags:
- name: Leaderboard
  description: ''
  externalDocs:
    description: ''
    url: ''
paths:
  /strategies/leaderboard:
    parameters:
    - in: query
      name: env
      description: 'variables allowed: mainnet-beta, devnet, localnet'
      schema:
        type: string
    - in: query
      name: period
      description: leaderboard time period "24h" | "7d" (default) | "30d" | "90d" | "180d" | "1y"
      schema:
        type: string
    get:
      summary: Get strategy leaderboard
      description: 'Leaderboard response is always ordered by profit and loss (PnL) descending.


        APY and PNL properties are in decimal form, to convert to percentage multiply it by 100. Volume and fees are both in USD.'
      operationId: getStrategiesLeaderboard
      tags:
      - Leaderboard
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /users/leaderboard:
    parameters:
    - in: query
      name: env
      description: 'variables allowed: mainnet-beta, devnet, localnet'
      schema:
        type: string
    - in: query
      name: period
      description: ' leaderboard time period "24h" | "7d" (default) | "30d" | "90d" | "180d" | "1y" | "all-time"'
      schema:
        type: string
    get:
      summary: Get user leaderboard
      description: 'Leaderboard response is always ordered by USD profit and loss (PnL) descending.


        PNL is in decimal form, to convert to percentage multiply it by 100. Total positions value and total returns are both in USD.'
      operationId: getUsersLeaderboard
      tags:
      - Leaderboard
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
externalDocs:
  description: Kamino API documentation
  url: https://github.com/kamino-finance/kamino-api-docs
