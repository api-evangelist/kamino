components:
  schemas:
    AddressBase58:
      type: string
      description: Valid base58-encoded address
      example: VEG1EMtttdHunMbSza8uoms1R18VXmYSph2bBpHcSJd
    KvaultUserRewardMetrics:
      type: array
      items:
        $ref: '#/components/schemas/KvaultUserRewardMetric'
      description: List of kvault user reward metrics
    KvaultPnlTimeseriesValue:
      type: object
      properties:
        timestamp:
          type: number
          description: Unix timestamp in milliseconds
        type:
          anyOf:
          - type: string
            enum:
            - buy
          - type: string
            enum:
            - sell
          - type: string
            enum:
            - mark-to-market
        position:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Current position value
        quantity:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Quantity involved in transaction
        tokenPrice:
          allOf:
          - $ref: '#/components/schemas/KvaultMultiValue'
          - description: Token price snapshot
        sharePrice:
          allOf:
          - $ref: '#/components/schemas/KvaultMultiValue'
          - description: Share price snapshot
        costBasis:
          allOf:
          - $ref: '#/components/schemas/KvaultMultiValue'
          - description: Cost basis for position
        realizedPnl:
          allOf:
          - $ref: '#/components/schemas/KvaultMultiValue'
          - description: Realized profit/loss
        pnl:
          allOf:
          - $ref: '#/components/schemas/KvaultMultiValue'
          - description: Total profit/loss
        positionValue:
          allOf:
          - $ref: '#/components/schemas/KvaultMultiValue'
          - description: Value of the position
        investment:
          allOf:
          - $ref: '#/components/schemas/KvaultMultiValue'
          - description: Total invested value
      required:
      - timestamp
      - type
      - position
      - quantity
      - tokenPrice
      - sharePrice
      - costBasis
      - realizedPnl
      - pnl
      - positionValue
      - investment
    UserKVaultTotal:
      type: object
      properties:
        createdOn:
          allOf:
          - $ref: '#/components/schemas/SnapshotDateTime'
          - description: Timestamp when the snapshot was created (ISO 8601 format)
            example: '2025-03-01T12:00:00.000Z'
        usdAmount:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: User's total amount across all vaults in USD
        solAmount:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: User's total amount across all vaults in SOL
        weightedApy:
          allOf:
          - $ref: '#/components/schemas/Apy'
          - description: Weighted average APY across all vaults in decimal format
            example: '0.2'
        cumulativeInterestEarnedUsd:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Total interest earned in USD across all vaults
        cumulativeInterestEarnedSol:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Total interest earned in SOL across all vaults
        interestEarnedPerSecondUsd:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Interest earned per second at that specific moment in USD
        interestEarnedPerSecondSol:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Interest earned per second at that specific moment in SOL
      required:
      - createdOn
      - usdAmount
      - solAmount
      - weightedApy
      - cumulativeInterestEarnedUsd
      - cumulativeInterestEarnedSol
      - interestEarnedPerSecondUsd
      - interestEarnedPerSecondSol
    Decimal:
      type: string
      description: Decimal value represented as string
      example: '1234.56789'
    The vault state object:
      type: object
      properties:
        vaultAdminAuthority:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the vault admin authority
        baseVaultAuthority:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the base vault authority
        baseVaultAuthorityBump:
          type: number
          description: Bump seed for the base vault authority
        tokenMint:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the token mint
        tokenMintDecimals:
          type: number
          description: Decimals of the token mint
        tokenVault:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the token vault
        tokenProgram:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the token program
        sharesMint:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the shares mint
        sharesMintDecimals:
          type: number
          description: Decimals of the shares mint
        tokenAvailable:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Amount of tokens available in the vault
        sharesIssued:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Total shares issued by the vault
        availableCrankFunds:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Available crank funds in the vault
        performanceFeeBps:
          type: number
          description: Performance fee in basis points
        managementFeeBps:
          type: number
          description: Management fee in basis points
        lastFeeChargeTimestamp:
          type: number
          description: Timestamp of the last fee charge
        prevAum:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Previous assets under management scaled factor
        pendingFees:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Pending fees scaled factor
        vaultAllocationStrategy:
          type: array
          items:
            type: object
            properties:
              reserve:
                allOf:
                - $ref: '#/components/schemas/AddressBase58'
                - description: Public key of the reserve
              ctokenVault:
                allOf:
                - $ref: '#/components/schemas/AddressBase58'
                - description: Public key of the cToken vault
              targetAllocationWeight:
                type: number
                description: Target allocation weight as a whole number
              tokenAllocationCap:
                type: string
                description: Token allocation cap in lamports
              ctokenVaultBump:
                type: number
                description: cToken vault bump seed
              ctokenAllocation:
                type: string
                description: cToken allocation in lamports
              lastInvestSlot:
                type: string
                description: Last invest slot
              tokenTargetAllocation:
                allOf:
                - $ref: '#/components/schemas/Decimal'
                - description: Token target allocation scaled factor
            required:
            - reserve
            - ctokenVault
            - targetAllocationWeight
            - tokenAllocationCap
            - ctokenVaultBump
            - ctokenAllocation
            - lastInvestSlot
            - tokenTargetAllocation
            description: Vault allocation strategy entry
          description: List of vault allocation strategies
        minDepositAmount:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Minimum deposit amount in lamports
        minWithdrawAmount:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Minimum withdraw amount in lamports
        minInvestAmount:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Minimum invest amount in lamports
        minInvestDelaySlots:
          type: number
          description: Minimum invest delay in slots
        crankFundFeePerReserve:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Crank fund fee per reserve
        pendingAdmin:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the pending admin
        cumulativeEarnedInterest:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Cumulative earned interest in decimal format
        cumulativeMgmtFees:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Cumulative management fees in decimal format
        cumulativePerfFees:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Cumulative performance fees in decimal format
        name:
