      - vaultAdminAuthority
      - baseVaultAuthority
      - baseVaultAuthorityBump
      - tokenMint
      - tokenMintDecimals
      - tokenVault
      - tokenProgram
      - sharesMint
      - sharesMintDecimals
      - tokenAvailable
      - sharesIssued
      - availableCrankFunds
      - performanceFeeBps
      - managementFeeBps
      - lastFeeChargeTimestamp
      - prevAum
      - pendingFees
      - vaultAllocationStrategy
      - minDepositAmount
      - minWithdrawAmount
      - minInvestAmount
      - minInvestDelaySlots
      - crankFundFeePerReserve
      - pendingAdmin
      - cumulativeEarnedInterest
      - cumulativeMgmtFees
      - cumulativePerfFees
      - name
      - vaultLookupTable
      - vaultFarm
      - creationTimestamp
      - allocationAdmin
    KvaultMultiValue:
      type: object
      properties:
        usd:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Value in USD
        sol:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Value in SOL
        token:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Value in token denomination
      required:
      - usd
      - sol
      - token
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message for internal server failure
          example: An internal error occurred
      required:
      - error
      description: Internal server error response (500)
      example:
        error: An internal error occurred
    SnapshotDateTime:
      type: string
      format: date-time
      description: Timestamp of the metrics snapshot
      example: '2023-06-29T15:15:26.464Z'
    KVaultInstruction:
      type: object
      properties:
        createdOn:
          type: string
          format: date
          description: Date when the instruction was created
        instruction:
          type: string
          description: Type of instruction
        tokenMint:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Token mint address
        tokenAmount:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Amount of tokens involved
        tokenPrice:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Price of the token at the time of instruction
        solPrice:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Price of SOL at the time of instruction
        sharePrice:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Price per share at the time of instruction
        numberOfShares:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Number of shares involved
        usdValue:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: USD value of the transaction
        transaction:
          type: string
          description: Transaction signature
        kvault:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: KVault identifier
        latestPosition:
          type: boolean
          description: Indicates if this is the latest position
      required:
      - createdOn
      - instruction
      - tokenMint
      - tokenAmount
      - tokenPrice
      - solPrice
      - sharePrice
      - numberOfShares
      - usdValue
      - transaction
      - kvault
      - latestPosition
    VaultStateArray:
      type: array
      items:
        type: object
        properties:
          address:
            allOf:
            - $ref: '#/components/schemas/AddressBase58'
            - description: Public key of the vault
          state:
            $ref: '#/components/schemas/The vault state object'
          programId:
            allOf:
            - $ref: '#/components/schemas/AddressBase58'
            - description: Public key of the kvault program which owns the vault
        required:
        - address
        - state
        - programId
    Apy:
      type: string
      description: Borrow interest APY
      example: '0.027610992938039702'
      examples:
      - '0.123'
      - '0'
      - '1'
      - '1.23'
      - '-0.5'
      - '999999.999999'
    UserKvaultMetrics:
      type: object
      properties:
        createdOn:
          allOf:
          - $ref: '#/components/schemas/SnapshotDateTime'
          - description: Timestamp when the snapshot was created (ISO 8601 format)
            example: '2025-03-01T12:00:00.000Z'
        sharesAmount:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: User's total shares amount
        usdAmount:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: User's USD amount in kvault
        solAmount:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: User's SOL amount in kvault
        apy:
          allOf:
          - $ref: '#/components/schemas/Apy'
          - description: APY in decimal format (not percentage) represented as string. Multiply by 100 to get percentage (%) - 0.1 in API response is 10%.
            example: '0.2'
        cumulativeInterestEarned:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Total interest earned in kvault token amount for kvault
        cumulativeInterestEarnedUsd:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Total interest earned in USD for kvault
        cumulativeInterestEarnedSol:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Total interest earned in SOL for kvault
        interestEarnedPerSecond:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Interest earned per second at that specific moment in token
        interestEarnedPerSecondUsd:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Interest earned per second at that specific moment in USD
        interestEarnedPerSecondSol:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Interest earned per second at that specific moment in SOL
      required:
      - createdOn
      - sharesAmount
      - usdAmount
      - solAmount
      - apy
      - cumulativeInterestEarned
      - cumulativeInterestEarnedUsd
      - cumulativeInterestEarnedSol
      - interestEarnedPerSecond
      - interestEarnedPerSecondUsd
      - interestEarnedPerSecondSol
    KvaultUserRewardMetric:
      type: object
      properties:
        avgBaseApy:
          allOf:
          - $ref: '#/components/schemas/Apy'
          - description: Average Base Annual Percentage Yield for the user
            example: '0.2'
        avgBoostedApy:
          allOf:
          - $ref: '#/components/schemas/Apy'
          - description: Average Boosted Annual Percentage Yield for the user
            example: '0.2'
        avgMaxApy:
          allOf:
          - $ref: '#/components/schemas/Apy'
          - description: Average Max Annual Percentage Yield for the user
            example: '0.2'
        rewardMint:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Mint address of the reward token
        lastCalculated:
          type: string
          format: date
          description: Timestamp of the last calculation
        tokensEarned:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Total number of reward tokens earned by the user
        tokensPerSecond:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Number of reward tokens distributed per second to the user
        stakingBoost:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Staking boost percentage applied to the user
        effectiveStakingBoost:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Effective staking boost percentage for the user
        baseApy:
          allOf:
          - $ref: '#/components/schemas/Apy'
          - description: Base Annual Percentage Yield from rewards for the user
            example: '0.2'
        boostedApy:
          allOf:
          - $ref: '#/components/schemas/Apy'
          - description: Boosted Annual Percentage Yield from rewards for the user
            example: '0.2'
        maxApy:
          allOf:
          - $ref: '#/components/schemas/Apy'
          - description: Max Annual Percentage Yield from rewards for the user
            example: '0.2'
        usdAmount:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Total USD amount of rewards earned by the user without boost
        usdAmountBoosted:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Total USD amount of rewards earned by the user with boost applied
      required:
      - avgBaseApy
      - avgBoostedApy
      - avgMaxApy
      - rewardMint
      - lastCalculated
      - tokensEarned
      - tokensPerSecond
      - stakingBoost
      - effectiveStakingBoost
      - baseApy
      - boostedApy
      - maxApy
      - usdAmount
      - usdAmountBoosted
    KvaultPnl:
      type: object
      properties:
        totalPnl:
          $ref: '#/components/schemas/KvaultMultiValue'
        totalCostBasis:
          $ref: '#/components/schemas/KvaultMultiValue'
      required:
      - totalPnl
      - totalCostBasis
