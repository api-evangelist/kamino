          description: Name of the vault
        vaultLookupTable:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the vault lookup table
        vaultFarm:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the vault farm
        creationTimestamp:
          type: number
          description: Timestamp of vault creation
        allocationAdmin:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
