openapi: 3.2.0
info:
  title: Kamino Finance Public Transactions API
  description: API for interacting with Kamino Finance — a Solana‑based DeFi platform offering automated liquidity vaults, lending/borrowing, leveraged strategies, and analytics.
  termsOfService: https://docs.kamino.finance/v/risk
  contact:
    name: Kamino Finance Support
    url: https://docs.kamino.finance
    email: support@kamino.finance
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://api.kamino.finance
  variables: {}
tags:
- name: Transactions
  description: ''
  externalDocs:
    description: ''
    url: ''
paths:
  /shareholders/{shareholder-pubkey}/transactions:
    parameters:
    - in: path
      name: shareholder-pubkey
      description: shareholder public key
      schema:
        type: string
      required: true
    - in: query
      name: env
      description: 'variables allowed: mainnet-beta, devnet, localnet'
      schema:
        type: string
    get:
      summary: Get all kamino transactions for specific shareholder
      description: Get all instructions for the specified Kamino (liquidity) shareholder.
      operationId: getShareholdersByShareholderPubkeyTransactions
      tags:
      - Transactions
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        createdOn:
                          type: string
                        timestamp:
                          type: string
                        transactionSignature:
                          type: string
                        transactionName:
                          type: string
                        strategy:
                          type: string
                        tokenA:
                          type: string
                        tokenAMint:
                          type: string
                        tokenAAmount:
                          type: string
                        tokenAPrice:
                          type: string
                        tokenB:
                          type: string
                        tokenBMint:
                          type: string
                        tokenBAmount:
                          type: string
                        tokenBPrice:
                          type: string
                        usdValue:
                          type: string
                        numberOfShares:
                          type: string
                        sharePrice:
                          type: string
                        solPrice:
                          type: string
                        latestPosition:
                          type: boolean
                      required:
                      - createdOn
                      - timestamp
                      - transactionSignature
                      - transactionName
                      - strategy
                      - tokenA
                      - tokenAPrice
                      - tokenAAmount
                      - tokenAMint
                      - tokenBAmount
                      - tokenBMint
                      - tokenB
                      - usdValue
                      - tokenBPrice
                      - sharePrice
                      - numberOfShares
                      - solPrice
                      - latestPosition
                required:
                - transactions
      x-operation-id-source: derived
externalDocs:
  description: Kamino API documentation
  url: https://github.com/kamino-finance/kamino-api-docs
