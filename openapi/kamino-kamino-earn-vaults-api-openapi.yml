    KvaultVaultTransaction:
      type: object
      properties:
        ix:
          $ref: '#/components/schemas/KvaultVaultEnrichedInstruction'
        timestamp:
          allOf:
          - $ref: '#/components/schemas/SnapshotDateTime'
          - description: Timestamp when the transaction was executed (ISO 8601 format)
            example: '2025-03-01T12:00:00.000Z'
        signature:
          type: string
          description: Transaction signature
          example: 2XWcSQVtR4NoHBhzYpDkYkmYtEFkFXC5ZwrKiPok1kvA86GvnN15qP7RNP6eTeNWgJqgnR1GA2M3QPp1hucW7e1v
        kvault:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Valid base58-encoded address of the vault
            example: HDsayqAsDWy3QvANGqh2yNraqcD8Fnjgh73Mhb3WRS5E
        wallet:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Valid base58-encoded address of the user wallet
            example: AxqtG9SHDkZTLSWg81Sp7VqAzQpRqXtR9ziJ3VQAS8As
      required:
      - ix
      - timestamp
      - signature
      - kvault
      - wallet
    VaultStateArray:
      type: array
      items:
        type: object
        properties:
          address:
            allOf:
            - $ref: '#/components/schemas/AddressBase58'
            - description: Public key of the vault
          state:
            $ref: '#/components/schemas/The vault state object'
          programId:
            allOf:
            - $ref: '#/components/schemas/AddressBase58'
            - description: Public key of the kvault program which owns the vault
        required:
        - address
        - state
        - programId
    KvaultVaultEnrichedInstruction:
      type: object
      properties:
        market:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: KLend market public key
        reserve:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: KLend reserve public key
        solPrice:
          $ref: '#/components/schemas/Decimal'
        sharePrice:
          $ref: '#/components/schemas/Decimal'
        tokenPrice:
          $ref: '#/components/schemas/Decimal'
        tokenAmount:
          $ref: '#/components/schemas/Decimal'
        numberOfShares:
          $ref: '#/components/schemas/Decimal'
      required:
      - solPrice
      - sharePrice
      - tokenPrice
      - tokenAmount
      - numberOfShares
    KvaultBulkTransaction:
      type: object
      properties:
        ix:
          $ref: '#/components/schemas/KvaultEnrichedInstruction'
        timestamp:
          allOf:
          - $ref: '#/components/schemas/SnapshotDateTime'
          - description: Timestamp when the transaction was executed (ISO 8601 format)
            example: '2025-03-01T12:00:00.000Z'
        signature:
          type: string
          description: Transaction signature
          example: 2XWcSQVtR4NoHBhzYpDkYkmYtEFkFXC5ZwrKiPok1kvA86GvnN15qP7RNP6eTeNWgJqgnR1GA2M3QPp1hucW7e1v
        kvault:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Valid base58-encoded address of the vault
            example: HDsayqAsDWy3QvANGqh2yNraqcD8Fnjgh73Mhb3WRS5E
        wallet:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Valid base58-encoded address of the user wallet
            example: AxqtG9SHDkZTLSWg81Sp7VqAzQpRqXtR9ziJ3VQAS8As
        rawJson:
          type: string
          description: Entire raw JSON of the instruction
      required:
      - ix
      - timestamp
      - signature
      - kvault
      - wallet
    Apy:
      type: string
      description: Borrow interest APY
      example: '0.027610992938039702'
      examples:
      - '0.123'
      - '0'
      - '1'
      - '1.23'
      - '-0.5'
      - '999999.999999'
