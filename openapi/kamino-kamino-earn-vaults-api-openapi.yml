  /kvaults/vaults/{pubkey}/allocation-volume/history:
    get:
      summary: Get historical KVault allocation volume
      description: Get historical Kamino Earn Vault allocation volume for a given vault and date range (max 1 year)
      tags:
      - Kamino Earn Vaults
      parameters:
      - schema:
          $ref: '#/components/schemas/AddressBase58'
        required: true
        description: Valid base58-encoded address
        name: pubkey
        in: path
      - schema:
          anyOf:
          - type: string
          - type: number
          description: Date input (ISO 8601 string or epoch in ms)
          examples:
          - '2024-01-01T00:00:00.000Z'
          - 1704067200000
          example: 2020-01-01T00:00Z
        required: false
        description: Date input (ISO 8601 string or epoch in ms)
        name: start
        in: query
      - schema:
          anyOf:
          - type: string
          - type: number
          description: Date input (ISO 8601 string or epoch in ms)
          examples:
          - '2024-01-01T00:00:00.000Z'
          - 1704067200000
          example: 2020-02-01T00:00Z
        required: false
        description: Date input (ISO 8601 string or epoch in ms)
        name: end
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date
                      description: Timestamp of the investment volume data point
                    volumeUsd:
                      allOf:
                      - $ref: '#/components/schemas/Decimal'
                      - description: Investment volume in USD
                  required:
                  - timestamp
                  - volumeUsd
                description: Array of investment volume data points
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: High-level error message describing the failure
                    example: Invalid query params
                  details:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        nullable: true
                    description: Detailed validation issues (present only for validation errors)
                required:
                - error
                description: Bad request response (400)
                example:
                  error: Invalid query request
                  details:
                  - code: invalid_union
                    errors:
                    - - code: custom
                        path: []
                        message: Invalid date string
                    - - expected: number
                        code: invalid_type
                        path: []
                        message: 'Invalid input: expected number, received string'
                    path:
                    - start
                    message: Invalid input
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    KvaultVaultTransactionsResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/KvaultVaultTransaction'
        paginationToken:
          type: string
          example: eyJsYXN0SWQiOjgxfQ==
          description: Optional pagination token
      required:
      - result
    AddressBase58:
      type: string
      description: Valid base58-encoded address
      example: VEG1EMtttdHunMbSza8uoms1R18VXmYSph2bBpHcSJd
    EnqueuedWithdrawTransactionsResponse:
      type: array
      items:
        $ref: '#/components/schemas/KlendWithdrawQueueTransactionV3'
    KvaultEnrichedInstruction:
      type: object
      properties:
        market:
          type: string
          description: KLend market public key
          example: EyV4jxSMd6vpuRgrxMFem7CKRhcB4Vv6WMRDtxPQNP4
        reserve:
          type: string
          description: KLend reserve public key
          example: ALnjBHECcdBsSwgVJ6A8pFEZ15qxE5jJQriCXSKT3Bte
        solPrice:
          $ref: '#/components/schemas/Decimal'
        sharePrice:
          $ref: '#/components/schemas/Decimal'
        tokenPrice:
          $ref: '#/components/schemas/Decimal'
        tokenAmount:
          $ref: '#/components/schemas/Decimal'
        numberOfShares:
          $ref: '#/components/schemas/Decimal'
      required:
      - solPrice
      - sharePrice
      - tokenPrice
      - tokenAmount
      - numberOfShares
      description: Enriched kvault instruction object
      example:
        tokenAmount: '835.924775'
        numberOfShares: '814.34612'
        solPrice: '138.7776002'
        sharePrice: '1.0263403430350673002'
        tokenPrice: '0.99984713'
    Decimal:
      type: string
      description: Decimal value represented as string
      example: '1234.56789'
    The vault state object:
      type: object
      properties:
        vaultAdminAuthority:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the vault admin authority
        baseVaultAuthority:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the base vault authority
        baseVaultAuthorityBump:
          type: number
          description: Bump seed for the base vault authority
        tokenMint:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the token mint
        tokenMintDecimals:
          type: number
          description: Decimals of the token mint
        tokenVault:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the token vault
        tokenProgram:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the token program
        sharesMint:
          allOf:
          - $ref: '#/components/schemas/AddressBase58'
          - description: Public key of the shares mint
        sharesMintDecimals:
          type: number
          description: Decimals of the shares mint
        tokenAvailable:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Amount of tokens available in the vault
        sharesIssued:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Total shares issued by the vault
        availableCrankFunds:
          allOf:
          - $ref: '#/components/schemas/Decimal'
          - description: Available crank funds in the vault
        performanceFeeBps:
