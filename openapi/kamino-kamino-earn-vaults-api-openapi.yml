            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: High-level error message describing the failure
                    example: Invalid query params
                  details:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        nullable: true
                    description: Detailed validation issues (present only for validation errors)
                required:
                - error
                description: Bad request response (400)
                example:
                  error: Invalid query request
                  details:
                  - code: invalid_union
                    errors:
                    - - code: custom
                        path: []
                        message: Invalid date string
                    - - expected: number
                        code: invalid_type
                        path: []
                        message: 'Invalid input: expected number, received string'
                    path:
                    - start
                    message: Invalid input
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /kvaults/vaults/{pubkey}:
    get:
      summary: Get KVault by address
      description: Get a single Kamino Earn Vault by the KVault account address
      tags:
      - Kamino Earn Vaults
      parameters:
      - schema:
          $ref: '#/components/schemas/AddressBase58'
        required: true
        description: Valid base58-encoded address
        name: pubkey
        in: path
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    allOf:
                    - $ref: '#/components/schemas/AddressBase58'
                    - description: Public key of the vault
                  state:
                    $ref: '#/components/schemas/The vault state object'
                  programId:
                    allOf:
                    - $ref: '#/components/schemas/AddressBase58'
                    - description: Public key of the kvault program which owns the vault
                required:
                - address
                - state
                - programId
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: High-level error message describing the failure
                    example: Invalid query params
                  details:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        nullable: true
                    description: Detailed validation issues (present only for validation errors)
                required:
                - error
                description: Bad request response (400)
                example:
                  error: Invalid query request
                  details:
                  - code: invalid_union
                    errors:
                    - - code: custom
                        path: []
                        message: Invalid date string
                    - - expected: number
                        code: invalid_type
                        path: []
                        message: 'Invalid input: expected number, received string'
                    path:
                    - start
                    message: Invalid input
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: string
                    description: Error message describing why it was not found
                    example: Account could not be found
                required:
                - metadata
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /kvaults/vaults/{pubkey}/metrics/history:
    get:
      summary: Get historical KVault metrics
      description: Get historical Kamino Earn Vault metrics for a given vault, between an optional range of dates
      tags:
      - Kamino Earn Vaults
      parameters:
      - schema:
          $ref: '#/components/schemas/AddressBase58'
        required: true
        description: Valid base58-encoded address
        name: pubkey
        in: path
      - schema:
          anyOf:
          - type: string
          - type: number
          default: '1970-01-01T00:00:00.000Z'
          description: Start date of the range (defaults to Unix epoch). Accepts ISO string or epoch in ms.
          examples:
          - '1970-01-01T00:00:00.000Z'
          - 0
        required: false
        description: Start date of the range (defaults to Unix epoch). Accepts ISO string or epoch in ms.
        name: start
        in: query
      - schema:
          anyOf:
          - type: string
          - type: number
          description: End date of the range (defaults to current time). Accepts ISO string or epoch in ms.
          examples:
          - '2025-01-01T00:00:00.000Z'
          - 1735689600000
        required: false
        description: End date of the range (defaults to current time). Accepts ISO string or epoch in ms.
        name: end
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: number
                      description: Unix timestamp in milliseconds
                    tvl:
                      allOf:
                      - $ref: '#/components/schemas/Decimal'
                      - description: Total Value Locked in token denomination
                    solTvl:
                      allOf:
                      - $ref: '#/components/schemas/Decimal'
                      - description: Total Value Locked in SOL
                    apy:
                      allOf:
                      - $ref: '#/components/schemas/Apy'
                      - description: Annual Percentage Yield
                        example: '0.2'
                    apyTheoretical:
                      allOf:
                      - $ref: '#/components/schemas/Apy'
                      - description: Theoretical Annual Percentage Yield
                        example: '0.2'
                    apyActual:
                      allOf:
                      - $ref: '#/components/schemas/Apy'
                      - description: Actual Annual Percentage Yield
                        example: '0.2'
                    apyFarmRewards:
                      allOf:
                      - $ref: '#/components/schemas/Apy'
                      - description: Annual Percentage Yield from Farm Rewards
                        example: '0.2'
                    apyReservesIncentives:
                      allOf:
                      - $ref: '#/components/schemas/Apy'
                      - description: Annual Percentage Yield from Reserves Incentives
                        example: '0.2'
                    apyIncentives:
                      allOf:
                      - $ref: '#/components/schemas/Apy'
                      - description: Annual Percentage Yield from Incentives
                        example: '0.2'
                    sharePrice:
                      allOf:
                      - $ref: '#/components/schemas/Decimal'
                      - description: Share Price of the vault
                    interest:
                      allOf:
                      - $ref: '#/components/schemas/Decimal'
                      - description: Interest earned in token denomination
                    interestUsd:
                      allOf:
                      - $ref: '#/components/schemas/Decimal'
                      - description: Interest earned in USD
                    interestSol:
                      allOf:
                      - $ref: '#/components/schemas/Decimal'
                      - description: Interest earned in SOL
                    reserves:
                      type: array
                      items:
                        type: object
                        properties:
                          pubkey:
                            allOf:
                            - $ref: '#/components/schemas/AddressBase58'
                            - description: Public key of the reserve
                          supplyApy:
                            allOf:
                            - $ref: '#/components/schemas/Apy'
                            - description: Supply Annual Percentage Yield
                              example: '0.2'
                          rewardsApy:
                            allOf:
                            - $ref: '#/components/schemas/Apy'
                            - description: Rewards Annual Percentage Yield
                              example: '0.2'
                          allocationRatio:
                            allOf:
                            - $ref: '#/components/schemas/Decimal'
                            - description: Allocation Ratio
                          rewardTokens:
                            type: array
                            items:
                              type: object
                              properties:
                                tokenMint:
                                  allOf:
                                  - $ref: '#/components/schemas/AddressBase58'
                                  - description: Token mint address
                                apy:
                                  allOf:
                                  - $ref: '#/components/schemas/Apy'
                                  - description: Annual Percentage Yield for the reward token
                                    example: '0.2'
                              required:
                              - tokenMint
                              - apy
                            description: List of reward tokens for the reserve
                        required:
                        - pubkey
                        - supplyApy
                        - rewardsApy
                        - allocationRatio
                        - rewardTokens
                      description: List of reserves with rewards
                    vaultRewards:
                      type: array
                      items:
                        type: object
                        properties:
                          tokenMint:
                            allOf:
                            - $ref: '#/components/schemas/AddressBase58'
                            - description: Token mint address
                          apy:
                            allOf:
                            - $ref: '#/components/schemas/Apy'
                            - description: Annual Percentage Yield for the vault reward token
                              example: '0.2'
                        required:
                        - tokenMint
                        - apy
                      description: List of vault reward tokens
                  required:
                  - timestamp
                  - tvl
                  - solTvl
                  - apy
                  - apyTheoretical
                  - apyActual
                  - apyFarmRewards
                  - apyReservesIncentives
                  - apyIncentives
                  - sharePrice
                  - interest
                  - interestUsd
                  - interestSol
                  - reserves
                  - vaultRewards
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: High-level error message describing the failure
                    example: Invalid query params
                  details:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        nullable: true
                    description: Detailed validation issues (present only for validation errors)
                required:
                - error
                description: Bad request response (400)
                example:
                  error: Invalid query request
                  details:
                  - code: invalid_union
                    errors:
                    - - code: custom
                        path: []
                        message: Invalid date string
                    - - expected: number
                        code: invalid_type
                        path: []
                        message: 'Invalid input: expected number, received string'
                    path:
                    - start
                    message: Invalid input
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
