openapi: 3.0.0
info:
  version: 1.0.0
  title: Kamino Public Airdrop Kamino Lend Repay API
  description: 'The Kamino API provides a comprehensive way to interact with Kamino without reading directly from the blockchain.


    The API also provides the ability to fetch data that might not be available from just reading the chain.


    The API is rate-limited for unauthenticated users. If you feel you need to make more requests or run into rate-limit issues, please reach out.

    '
servers:
- url: https://api.kamino.finance
tags:
- name: Kamino Lend Repay
paths:
  /ktx/klend/repay:
    post:
      summary: Get transaction to repay debt of a klend reserve
      tags:
      - Kamino Lend Repay
      description: Repay a debt position for the specified Kamino Lend market reserve
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet:
                  description: User wallet address (base58) that will also sign the transaction
                  format: solana-base58-address
                  minLength: 32
                  maxLength: 44
                  type: string
                  example: KUMtRazMP7vwvc2kthnGZ9Cq6ZsGRiYC97snMYepNx9
                market:
                  description: Target Kamino Lend market address
                  format: solana-base58-address
                  minLength: 32
                  maxLength: 44
                  type: string
                  example: 7u3HeHxYDLhnCoErrtycNokbQYbWGzLs6JSDqGAv5PfF
                reserve:
                  description: Target Kamino Lend Reserve address. The reserve must belong to the specified market
                  format: solana-base58-address
                  minLength: 32
                  maxLength: 44
                  type: string
                  example: D6q6wuQSrifJKZYpR1M8R4YawnLDtDsMmWM1NbBmgJ59
                amount:
                  description: Amount of debt to repay (in decimal format, not lamports)
                  format: decimal-positive-amount
                  type: string
                  example: '0.1234'
              required:
              - wallet
              - market
              - reserve
              - amount
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    description: Encoded transaction ready to send
                    type: string
                    example: 
                required:
                - transaction
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP error code
                    type: number
                    example: 400
                  message:
                    description: Error message describing the issue
                    type: string
                  error:
                    description: Short description of the http status code
                    type: string
                    example: Bad Request
                  code:
                    description: Kamino error code
                    anyOf:
                    - type: string
                      enum:
                      - DECIMAL_TO_LAMPORTS_OVERFLOW
                    - type: string
                      enum:
                      - KLEND_MARKET_NOT_FOUND
                    - type: string
                      enum:
                      - KLEND_OBLIGATION_NOT_FOUND
                    - type: string
                      enum:
                      - KLEND_RESERVE_NOT_FOUND
                    - type: string
                      enum:
                      - KVAULT_NOT_FOUND
                    - type: string
                      enum:
                      - TRANSACTION_SIZE_ERROR
                required:
                - statusCode
                - message
                - error
  /ktx/klend/repay-instructions:
    post:
      summary: Get instructions to repay debt of a klend reserve
      tags:
      - Kamino Lend Repay
      description: Instructions to repay a debt position for the specified Kamino Lend market reserve. Additionally includes lookup tables to use to compress transaction size
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet:
                  description: User wallet address (base58) that will also sign the transaction
                  format: solana-base58-address
                  minLength: 32
                  maxLength: 44
                  type: string
                  example: KUMtRazMP7vwvc2kthnGZ9Cq6ZsGRiYC97snMYepNx9
                market:
                  description: Target Kamino Lend market address
                  format: solana-base58-address
                  minLength: 32
                  maxLength: 44
                  type: string
                  example: 7u3HeHxYDLhnCoErrtycNokbQYbWGzLs6JSDqGAv5PfF
                reserve:
                  description: Target Kamino Lend Reserve address. The reserve must belong to the specified market
                  format: solana-base58-address
                  minLength: 32
                  maxLength: 44
                  type: string
                  example: D6q6wuQSrifJKZYpR1M8R4YawnLDtDsMmWM1NbBmgJ59
                amount:
                  description: Amount of debt to repay (in decimal format, not lamports)
                  format: decimal-positive-amount
                  type: string
                  example: '0.1234'
              required:
              - wallet
              - market
              - reserve
              - amount
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  instructions:
                    type: array
                    items:
                      type: object
                      properties:
                        accounts:
                          type: array
                          items:
                            type: object
                            properties:
                              address:
                                type: string
                              role:
                                type: string
                              signer:
                                type: object
                                properties:
                                  address:
                                    type: string
                                required:
                                - address
                            required:
                            - address
                            - role
                            example:
                              address: 9y7uLMUMW6EiRwH1aJFSp9Zka7dVx2JdZKA3858u6YHT
                              role: WRITABLE_SIGNER
                              signer:
                                address: 9y7uLMUMW6EiRwH1aJFSp9Zka7dVx2JdZKA3858u6YHT
                        data:
                          anyOf:
                          - type: string
                          - type: 'null'
                          example: 8iPGiVLh8rYA4fUFAAAAAA==
                        programAddress:
                          type: string
                          example: KvauGMspG5k6rtzrqqn7WNn3oZdyKqLKwK2XWQ8FLjd
                      required:
                      - accounts
                      - data
                      - programAddress
                  lutsByAddress:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        description: Referenced LUT address
                        type: string
                    example:
                      9p2oT9J6BojHigd3V5qXzrwsQf4dtgMgLxtrzLVR3rwu:
                      - sadmBTQm5HJsyzWHEjV4YwG9CiahZKVDVqAyS4Wx1zH
                      - HDsayqAsDWy3QvANGqh2yNraqcD8Fnjgh73Mhb3WRS5E
                      - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                required:
                - instructions
                - lutsByAddress
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    description: HTTP error code
                    type: number
                    example: 400
                  message:
                    description: Error message describing the issue
                    type: string
                  error:
                    description: Short description of the http status code
                    type: string
                    example: Bad Request
                  code:
                    description: Kamino error code
                    anyOf:
                    - type: string
                      enum:
                      - DECIMAL_TO_LAMPORTS_OVERFLOW
                    - type: string
                      enum:
                      - KLEND_MARKET_NOT_FOUND
                    - type: string
                      enum:
                      - KLEND_OBLIGATION_NOT_FOUND
                    - type: string
                      enum:
                      - KLEND_RESERVE_NOT_FOUND
                    - type: string
                      enum:
                      - KVAULT_NOT_FOUND
                    - type: string
                      enum:
                      - TRANSACTION_SIZE_ERROR
                required:
                - statusCode
                - message
                - error
