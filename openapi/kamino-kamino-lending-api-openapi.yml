        '
      schema:
        type: string
    - in: query
      name: positionMode
      description: 'user_all_time | user_all_current_positions '
      schema:
        type: string
    get:
      summary: Get interest fees earned per user
      description: ''
      operationId: getKaminoMarketByMarketPubkeyUsersByUserPubkeyInterestFees
