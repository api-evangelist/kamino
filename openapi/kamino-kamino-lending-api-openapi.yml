openapi: 3.2.0
info:
  title: Kamino Finance Public Kamino Lending API
  description: API for interacting with Kamino Finance — a Solana‑based DeFi platform offering automated liquidity vaults, lending/borrowing, leveraged strategies, and analytics.
  termsOfService: https://docs.kamino.finance/v/risk
  contact:
    name: Kamino Finance Support
    url: https://docs.kamino.finance
    email: support@kamino.finance
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://api.kamino.finance
  variables: {}
tags:
- name: Kamino Lending
  description: ''
  externalDocs:
    description: ''
    url: ''
paths:
  /kamino-market:
    parameters:
    - in: query
      name: programId
      description: program Id
      schema:
        type: string
      required: true
    get:
      summary: Get all Kamino Markets
      description: ''
      operationId: getKaminoMarket
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /kamino-market/{market-pubkey}:
    parameters:
    - in: path
      name: market-pubkey
      description: market public key
      schema:
        type: string
      required: true
    - in: query
      name: programId
      description: program id
      schema:
        type: string
      required: true
    get:
      summary: Get specific kamino market config
      description: ''
      operationId: getKaminoMarketByMarketPubkey
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /kamino-market/{market-pubkey}/metrics/history:
    parameters:
    - in: path
      name: market-pubkey
      description: market public key
      schema:
        type: string
      required: true
    - in: query
      name: env
      description: 'variables allowed: mainnet-beta, devnet, localnet'
      schema:
        type: string
    - in: query
      name: start
      description: 'timestamp ex: 2023-01-02'
      schema:
        type: string
    - in: query
      name: end
      description: 'timestamp ex: 2023-01-02'
      schema:
        type: string
    get:
      summary: Get KLend Market metrics history
      description: ''
      operationId: getKaminoMarketByMarketPubkeyMetricsHistory
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /kamino-market/{market-pubkey}/reserves/{reserve-pubkey}/metrics/history:
    parameters:
    - in: path
      name: market-pubkey
      description: market public key
      schema:
        type: string
      required: true
    - in: path
      name: reserve-pubkey
      description: reserve public key
      schema:
        type: string
      required: true
    - in: query
      name: env
      description: 'variables allowed: mainnet-beta, devnet, localnet'
      schema:
        type: string
    - in: query
      name: start
      description: timestamp
      schema:
        type: string
    - in: query
      name: end
      description: timestamp
      schema:
        type: string
    - in: query
      name: frequency
      description: frequency of the snapshots, e.g. "hour" (default) | "day"
      schema:
        type: string
    get:
      summary: Get KLend reserve history
      description: ''
      operationId: getKaminoMarketByMarketPubkeyReservesByReservePubkeyMetricsHistory
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /kamino-market/{market-pubkey}/reserves/{reserve-pubkey}/borrow-and-staking-apys/history:
    parameters:
    - in: query
      name: env
      description: 'variables allowed: mainnet-beta, devnet, localnet'
      schema:
        type: string
    - in: query
      name: start
      description: timestamp
      schema:
