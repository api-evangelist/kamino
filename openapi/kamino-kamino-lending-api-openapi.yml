      schema:
        type: string
    - in: query
      name: positionMode
      description: 'values allowed: obligation_all_time" | current_obligation'
      schema:
        type: string
    get:
      summary: Get interest fees earned per obligation
      description: ''
      operationId: getKaminoMarketByMarketPubkeyObligationsByObligationPubkeyInterestFees
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
