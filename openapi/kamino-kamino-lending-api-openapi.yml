    - in: query
      name: end
      description: timestamp
      schema:
        type: string
    - in: path
      name: market-pubkey
      description: market public key
      schema:
        type: string
      required: true
    - in: path
      name: reserve-pubkey
      description: reserve public key
      schema:
        type: string
      required: true
    get:
      summary: Get KLend reserve borrow APY and staking APY history
      description: Get history of klend reserve borrow interest APY and staking APY. This will only return data for reserves that contain a LST token with staking yield.
      operationId: getKaminoMarketByMarketPubkeyReservesByReservePubkeyBorrowAndStakingApysHistory
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /kamino-market/{market-pubkey}/reserves/{reserve-pubkey}/borrow-and-staking-apys/history/median:
    parameters:
    - in: query
      name: env
      description: 'variables allowed: mainnet-beta, devnet, localnet'
      schema:
        type: string
    - in: query
      name: start
      description: timestamp
      schema:
        type: string
    - in: query
      name: end
      description: timestamp
      schema:
        type: string
    - in: path
      name: market-pubkey
      description: market public key
      schema:
        type: string
      required: true
    - in: path
      name: reserve-pubkey
      description: reserve public key
      schema:
        type: string
      required: true
    get:
      summary: Get KLend reserve borrow APY and staking APY history median
      description: ''
      operationId: getKaminoMarketByMarketPubkeyReservesByReservePubkeyBorrowAndStakingApysHistoryMedian
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /kamino-market/{market-pubkey}/obligations/{obligation-pubkey}/metrics/history:
    parameters:
    - in: query
      name: env
      description: 'variables allowed: mainnet-beta, devnet, localnet'
      schema:
        type: string
    - in: query
      name: start
      description: 'ex: 2023-01-01'
      schema:
        type: string
    - in: query
      name: end
      description: 'ex: 2023-01-01'
      schema:
        type: string
    - in: query
      name: frequency
      description: frequency of the snapshots, e.g. "hour" (default) | "day"
      schema:
        type: string
    - in: path
      name: market-pubkey
      description: market public key
      schema:
        type: string
      required: true
    - in: path
      name: obligation-pubkey
      description: obligation public key
      schema:
        type: string
      required: true
    get:
      summary: Get KLend obligation history
      description: ''
      operationId: getKaminoMarketByMarketPubkeyObligationsByObligationPubkeyMetricsHistory
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /v2/kamino-market/{market-pubkey}/obligations/{obligation-pubkey}/metrics/history:
    parameters:
    - in: query
      name: env
      description: ''
      schema:
        type: string
    - in: query
      name: start
      description: 'ex: 2023-01-01'
      schema:
        type: string
    - in: query
      name: end
      description: 'ex: 2023-01-01'
      schema:
        type: string
    - in: query
      name: useStakeRateForObligation
      description: true or false. Use stake rate to calc net sol value
      schema:
        type: string
    - in: path
      name: market-pubkey
      description: market public key
      schema:
        type: string
      required: true
    - in: path
      name: obligation-pubkey
      description: obligation public key
      schema:
        type: string
      required: true
    get:
      summary: Get KLend obligation history v2
      description: ''
      operationId: getV2KaminoMarketByMarketPubkeyObligationsByObligationPubkeyMetricsHistory
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /kamino-market/{market-pubkey}/users/{user-pubkey}/obligations:
    parameters:
    - in: path
      name: market-pubkey
      description: market market public key
      schema:
        type: string
      required: true
    - in: path
      name: user-pubkey
      description: user public key
      schema:
        type: string
      required: true
    - in: query
      name: env
      description: 'variables allowed: mainnet-beta, devnet, localnet'
      schema:
        type: string
    get:
      summary: Get all user obligations
      description: ''
      operationId: getKaminoMarketByMarketPubkeyUsersByUserPubkeyObligations
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /kamino-market/{market-pubkey}/users/{user-pubkey}/transactions:
    parameters:
    - in: path
      name: market-pubkey
      description: market public key
      schema:
        type: string
      required: true
    - in: path
      name: user-pubkey
      description: user public key
      schema:
        type: string
      required: true
    get:
      summary: Get KLend tx history per user (for all obligations)
      description: ''
      operationId: getKaminoMarketByMarketPubkeyUsersByUserPubkeyTransactions
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /kamino-market/{market-pubkey}/obligations/{obligation-pubkey}/transactions/:
    parameters:
    - in: path
      name: market-pubkey
      description: market public key
      schema:
        type: string
      required: true
    - in: path
      name: obligation-pubkey
      description: obligation public key
      schema:
        type: string
      required: true
    - in: query
      name: env
      description: 'variables allowed: mainnet-beta, devnet, localnet'
      schema:
        type: string
    - in: query
      name: useLogPrices
      description: ''
      schema:
        type: string
    get:
      summary: Get KLend tx history per obligation
      description: ''
      operationId: getKaminoMarketByMarketPubkeyObligationsByObligationPubkeyTransactions
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /v2/kamino-market/{market-pubkey}/obligations/{obligation-pubkey}/pnl/:
    parameters:
    - in: path
      name: market-pubkey
      description: market-public key
      schema:
        type: string
      required: true
    - in: path
      name: obligation-pubkey
      description: obligation public key
      schema:
        type: string
      required: true
    - in: query
      name: positionMode
      description: 'values allowed: obligation_all_time, current_obligation'
      schema:
        type: string
    - in: query
      name: useStakeRate
      description: true or false
      schema:
        type: string
    get:
      summary: Get PnL per obligation v2
      description: 'You can specify pnl mode with query param positionMode with one of these values: (obligation_all_time, current_obligation). By default, pnl mode is set to current_obligation position For xSOL pairs, useStakeRate query param can be set to true to calculate the PnL using the stake rate. By default, it is set to false.


        These parameters specify whether we return the current position PnL or the accumulated PnL throughout the lifetime of the user''s obligation (even before they were closed).'
      operationId: getV2KaminoMarketByMarketPubkeyObligationsByObligationPubkeyPnl
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /kamino-market/{market-pubkey}/users/{user-pubkey}/pnl:
    parameters:
    - in: path
      name: market-pubkey
      description: market public key
      schema:
        type: string
      required: true
    - in: path
      name: user-pubkey
      description: user public key
      schema:
        type: string
      required: true
    - in: query
      name: positionMode
      description: 'values allowed: user_all_time | user_all_current_positions'
      schema:
        type: string
    get:
      summary: Get PnL per user
      description: 'You can specify pnl mode with query param positionMode with one of these values: {user_all_time, user_all_current_positions}. By default, pnl mode is set to user_all_current_positions position


        These parameters specify whether we return the current position PnL or the accumulated PnL throughout the lifetime of the user''s obligation (even before they were closed).'
      operationId: getKaminoMarketByMarketPubkeyUsersByUserPubkeyPnl
      tags:
      - Kamino Lending
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
