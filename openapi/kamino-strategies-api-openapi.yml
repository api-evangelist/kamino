      description: ''
      operationId: getStrategiesTvl
      tags:
      - Strategies
      parameters: []
      responses:
        '200':
          description: OK
      x-operation-id-source: derived
  /strategies/tokens/{mint}/amounts:
    parameters:
    - in: path
      name: mint
      description: token address
      schema:
        type: string
      required: true
    - in: query
      name: env
      description: 'variables allowed: mainnet-beta, devnet, localnet'
