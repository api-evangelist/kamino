aid: kamino
name: Kamino
description: Kamino Finance is a Solana DeFi protocol for lending and borrowing (Kamino Lend / klend),
  automated concentrated-liquidity and yield vaults (Kamino Earn / kvault), leveraged 'Multiply' strategies,
  limit orders, token swaps, and the Scope price-oracle aggregator. The Kamino Public API exposes language-agnostic
  HTTPS/JSON endpoints for reading real-time and historical protocol data, user positions, rewards, portfolio
  values, oracle prices and staking yields, plus a Transactions API that builds UNSIGNED Solana transactions
  for deposit, borrow, repay, withdraw and vault operations that clients sign with their own wallet. First-party
  TypeScript SDKs are published under the @kamino-finance npm org.
